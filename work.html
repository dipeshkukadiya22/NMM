<!doctype html>
<html>

<head>
    <title>Work - Nimbu Mirchi Media</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/src/images/favicon.ico">
    <link href="/public/style.css" rel="stylesheet">

    <script type="module">
        import { navbarHTML, footerHTML, setupJsScripts } from "./utils.js"
        window.addEventListener('DOMContentLoaded', () => {
            // const navbarEl = document.getElementById('navbar')
            const footerEl = document.getElementById('footer')

            // Insert navbar as the very first element inside <body>
            document.body.insertAdjacentHTML('afterbegin', navbarHTML);
            footerEl.innerHTML = footerHTML

            // Scripts are ran separately because on inserting script with innerhtml, the <script> tag becomes inert and it doesn't run
            setupJsScripts();
        })
    </script>

    <script type="module">
        import { getClientInfo, getRandomClients } from './data.js';

        // --- Get client parameter from URL ---
        const urlParams = new URLSearchParams(window.location.search);
        const client = urlParams.get('client');

        // --- Fetch data for the selected client and some random clients ---
        const data = getClientInfo(client);
        const otherClients = getRandomClients(8);

        // --- Generate video cards for work section ---
        const generateWorkCards = (videos) => videos.map((item) => `
            <div class="bg-white p-[2px] md:p-2 shadow-[4px_4px_0px_#F47920] md:shadow-[6px_6px_0px_#F47920]">
                <iframe class="h-[250px] md:h-[530px]" width="100%" src="${item.src}?rel=0"
                    title="${item.title}" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
                </iframe>
                <h2 class="tex-[18px] md:text-[26px] text-black font-abeezee p-1 pt-2">
                    ${item.title}
                </h2>
            </div>
        `).join('');

        // --- Generate single client card for "Other Clients" section ---
        const createClientCard = (item) => `
            <div class="group bg-[#0F0F0F] border-2 border-[#3D3D3D] rounded-lg">
                <a ${item.customUrl ? `href="${item.customUrl}"" target="_blank"` : `href="./work.html?client=${item.id}"`} class="flex flex-col h-[170px] sm:h-[210px] lg:h-[250px] p-3 md:p-4">
                    <div class="flex justify-center items-center h-full max-sm:p-1">
                        <img src="${item.logoUrl}" alt="${item.title}">
                    </div>
                    <div
                        class="flex justify-center md:justify-between items-center text-[12px] md:text-[14px] font-abeezee 
                               border-1 border-[#FFFFFF] shadow-[2px_2px_0_#FFFFFF] pl-2 md:pl-3 pr-2 h-10 md:h-12">
                        <span>View Projects</span>
                        <div class="max-md:hidden w-4 md:w-5 h-4 md:h-5 border-[0.8px] border-white group-hover:bg-[#F47920] 
                                    flex items-center justify-center relative">
                            <img src="/src/images/right-arrow.svg" alt="Right Arrow"
                                class="absolute group-hover:opacity-0 opacity-100 w-2 md:w-3">
                            <img src="/src/images/diagonal-arrow.svg" alt="Diagonal Arrow"
                                class="absolute opacity-0 group-hover:opacity-100 w-2 md:w-3">
                        </div>
                    </div>
                </a>
            </div>`;

        // --- Render multiple client cards inside a container ---
        const renderClients = (container, list) => {
            container.innerHTML = list.map(createClientCard).join('');
        };

        // --- DOM ready logic ---
        window.addEventListener('DOMContentLoaded', () => {
            const imageEl = document.getElementById('client-image');
            const workEl = document.getElementById('work-container');
            const otherClientsEl = document.getElementById('otherClients');
            const workTitle = document.getElementById('work-title');

            let workSectionContent = '';
            const videos = data?.videos || [];

            // --- Logo container (reused for all cases) ---
            const logoContainer = `
                <div class="min-md:hidden bg-[#0F0F0F] border-2 border-[#F47920] h-[120px] flex flex-col p-1">
                    <div class="flex justify-center items-center h-full">
                        <img src="${data.logo}" alt="${data.title}" class="max-w-full max-h-full">
                    </div>
                </div>`;

            // --- Decide what to render in the "work" section based on video count ---
            if (videos.length === 0) {
                workSectionContent = `
                    ${logoContainer}
                    <p class="bg-white text-black text-center py-2 my-1">No Videos Found!</p>`;
                    workEl.classList.add("h-[480px]", "md:h-[700px]");
            } else {
                workSectionContent = `${logoContainer}${generateWorkCards(videos)}`;

                // Adjust container height depending on number of videos
                if (videos.length === 1) {
                    workEl.classList.add("h-[480px]", "md:h-[700px]");
                } else {
                    workEl.classList.add("h-[530px]", "md:h-[700px]");
                }
            }

            // --- Set client logo in header ---
            imageEl.setAttribute('src', data.logo);
            imageEl.setAttribute('alt', data.title)

            // --- Render work section content ---
            workEl.innerHTML = workSectionContent;

            // --- Scroll event for changing work title ---
            workEl.addEventListener("scroll", (event) => {
                workTitle.textContent = event.target.scrollTop > 80
                    ? data.title
                    : 'Recent Works';
            });

            // --- Render "Other Clients" section ---
            renderClients(otherClientsEl, otherClients);
        });
    </script>


</head>

<body class="relative bg-black bg-gray-grid text-white">

    <main class="">

        <section class="px-[15px]">
            <div class="container flex gap-4 pt-5 pb-10 md:py-10 gap-6 md:gap-10 max-md:flex-col">
                <div class="md:w-7/10">
                    <div id="work-container" class="flex flex-col gap-8 overflow-auto no-scrollbar">
                    </div>
                </div>

                <div class="md:w-3/10 max-md:-order-1">
                    <div class="">
                        <div
                            class="flex justify-between items-center text-[20px] md:text-[24px] bg-white text-black font-abeezee border-1 border-[#F47920] shadow-[4px_4px_0_#F47920] px-3 py-2">
                            <span id="work-title" class="md:hidden">Recent Works</span>
                            <span class="max-md:hidden">Recent Works</span> <!-- Two span tags for : Not changing 'recent works' heading in desktop screens -->
                            <div class="w-8 h-8 flex items-center justify-center">
                                <img src="./src/images/recent-works.png" alt="">
                            </div>
                        </div>
                        <div class="hidden md:block mt-6">
                            <div
                                class="bg-[#0F0F0F] border-2 border-[#F47920] shadow-[4px_4px_0_#F47920] h-[250px] flex flex-col p-4">
                                <div class="flex justify-center items-center h-full">
                                    <img id="client-image" src="" alt="" class="object-contain">
                                </div>
                            </div>
                        </div>
                        <div class="hidden md:block mt-15 relative h-82">
                            <img src="./src/images/recent-work-1.png" alt="decorative image"
                                class="absolute top-3 left-5 w-[150px]">
                            <img src="./src/images/recent-work-2.png" alt="decorative image"
                                class="absolute -top-2 right-0 w-[80px]">
                            <img src="./src/images/recent-work-3.png" alt="decorative image"
                                class="absolute bottom-0 left-1 w-[85px]">
                            <img src="./src/images/recent-work-4.png" alt="decorative image"
                                class="absolute bottom-0 right-0 w-[130px]">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section
            class="bg-black overflow-hidden bg-[url('/src/images/grid.svg')] bg-repeat-x bg-position-[left_top_-28rem] max-md:pt-5">

            <div class="container mx-auto md:pb-5 px-[15px] md:px-0 mb-8">

                <div class="flex flex-col md:flex-row md:justify-between md:items-end pb-5 md:pb-10 gap-3 md:gap-0">
                    <div class="flex items-end w-[90%] lg:w-[40%] xl:w-[36%]">
                        <div class="relative">

                            <h3
                                class="inline-block bg-white text-black p-2 md:p-4 border-[2px] border-[#000000] text-[1.7rem] md:text-[48px] leading-9 md:leading-12 z-5">
                                Keep exploring Our Works</h3>
                        </div>
                        <div>
                            <img src="/src/images/Vector-5.svg" alt=""
                                class="bg-white border-r-[2px] border-y-[2px] w-13 md:w-18 border-black p-1 md:p-2">
                        </div>
                    </div>
                    <div class="relative lg:w-[37%] xl:w-[31%]">

                        <div class="hidden md:block absolute -left-12 -top-12">
                            <img src="/src/images/Star-1.svg" class="w-25 -rotate-12">
                        </div>

                        <p
                            class="inline-block bg-white text-black p-2 border-[2px] border-[#F47920] shadow-[4px_4px_0px_#F47920] z-5 relative font-abeezee">
                            We’re inspired by amazing collaborations every day. Each partnership fuels our creativity
                            and pushes us to
                            deliver our best work.</p>
                    </div>
                </div>

                <div id="otherClients"
                    class="container border-2 md:border-3 border-[#F47920] shadow-[4px_4px_0_#F47920] md:shadow-[8px_8px_0_#F47920] md:py-5 p-2 md:px-6 grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3 md:gap-5 bg-white">

                </div>

        </section>

    </main>

    <div id="footer">
        <!-- Footer is Rendored Dynamically -->
    </div>
